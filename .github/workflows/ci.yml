name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit & Integration Test Suite
        env:
          NODE_ENV: test
          MONGODB_TEST_URI: mongodb://localhost:27017/project_manager_test
          REDIS_URL: redis://localhost:6379
          ACCESS_TOKEN_SECRET: ci_test_access_token_secret_min_32_chars_long
        run: npm run test

      - name: Compile Production Bundles
        run: npm run build
