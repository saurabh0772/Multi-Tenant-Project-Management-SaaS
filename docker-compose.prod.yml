version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: saas_prod_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-project_manager_prod}
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: saas_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: saas_prod_api
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      CLIENT_URL: ${CLIENT_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-500}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_USER: ${METRICS_USER}
      METRICS_PASS: ${METRICS_PASS}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      STORAGE_DRIVER: local
    volumes:
      - uploads-prod-data:/app/server/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: saas_prod_worker
    command: ["node", "server/dist/worker.js"]
    restart: always
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: saas_prod_client
    restart: always
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - api

volumes:
  mongo-prod-data:
  redis-prod-data:
  uploads-prod-data:
